title: "Prompt to Decision"
subtitle: "The decision-making your AI agent assumes you already know"
cover: "cover.png"
author:
  name: "Alfonso Sastre"
  bio: >-
    Alfonso Sastre is a theoretical physicist by training. His PhD and four
    years of postdoctoral research were in lattice QCD, a field where the
    physics comes out of large-scale simulation — which meant writing
    high-performance code and analysing the data it produced. Since 2015 he has
    worked as a data scientist in travel, banking and electric mobility.
language: en
output: "prompt-to-decision.epub"

copyright:
  year: "2026"
  license: "CC BY-NC 4.0"
  license_url: "https://creativecommons.org/licenses/by-nc/4.0/"
  notice:
    - >-
      Written with the assistance of an AI agent, which is the only honest way
      to write this particular book. Every claim in it is the author's to defend.

theme:
  base_font: serif
  page_size: 6x9
  font_size_pt: 11.0
  stylesheet: "style.css"
  stylesheet_mode: extend

chapters:
  # `title` overrides each chapter's own H1 for the rendered heading and TOC
  # entry, prefixing "Chapter N" — see CLAUDE.md and the equivalent
  # convention in the other three volumes' book.yaml. The Markdown source
  # keeps its own plain H1.
  # Part I — The Ground
  - { file: chapters/01-the-handoff.md,                          title: "Chapter 1 — The Handoff" }
  - { file: chapters/02-what-are-you-actually-trying-to-achieve.md, title: "Chapter 2 — What Are You Actually Trying to Achieve?" }
  # Part II — Framing the Decision
  - { file: chapters/03-what-are-the-alternatives.md,            title: "Chapter 3 — What Are the Alternatives?" }
  - { file: chapters/04-what-happens-if-you-do-nothing.md,       title: "Chapter 4 — What Happens If You Do Nothing?" }
  - { file: chapters/05-what-are-you-optimizing-for.md,          title: "Chapter 5 — What Are You Optimizing For?" }
  - { file: chapters/06-whose-preferences-are-these.md,          title: "Chapter 6 — Whose Preferences Are These?" }
  # Part III — Sizing the Stakes
  - { file: chapters/07-what-would-change-your-mind.md,          title: "Chapter 7 — What Would Change Your Mind?" }
  - { file: chapters/08-reversible-and-irreversible.md,          title: "Chapter 8 — Reversible and Irreversible" }
  - { file: chapters/09-the-cost-of-being-wrong.md,              title: "Chapter 9 — The Cost of Being Wrong" }
  - { file: chapters/10-what-do-you-learn-by-waiting.md,         title: "Chapter 10 — What Do You Learn by Waiting?" }
  # Part IV — Beyond the Decision
  - { file: chapters/11-the-second-order-effect.md,              title: "Chapter 11 — The Second-Order Effect" }
  - { file: chapters/12-who-bears-the-risk.md,                   title: "Chapter 12 — Who Bears the Risk?" }
  # Part V — Working With the Agent
  - { file: chapters/13-when-the-agent-disagrees-with-you.md,    title: "Chapter 13 — When the Agent Disagrees With You" }
  - { file: chapters/14-who-owns-the-decision.md,                title: "Chapter 14 — Who Owns the Decision?" }
  - { file: chapters/15-the-minimum-bar.md,                      title: "Chapter 15 — The Minimum Bar" }
  # Afterword. Deliberately left unnumbered, like the equivalent chapter in
  # the other three volumes — see "The afterword is a real chapter, not
  # front matter" in prompt-to-production's CLAUDE.md. Still counted by the
  # chapter linter, since chapter_files() reads the number from the
  # filename regardless.
  - { file: chapters/16-a-note-from-the-author.md, title: "" }

front_matter:
  - title_page
  - copyright
  # The series map opens the book. A reader meets "the second book in this
  # series" in chapter 1; the page that explains what that is has to come
  # before it, not 150 pages later in the back matter.
  - { file: ABOUT-THE-SERIES.md, title: "The Prompt to... Series" }
  - toc

back_matter:
  # Generated from glossary.yaml by `make glossary` — do not edit by hand.
  - { file: GLOSSARY.md, title: "Glossary" }
  - about_author
  - { file: COLOPHON.md, title: "Colophon" }
